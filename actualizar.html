<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar TEMPLE</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#101315;color:#edf0e8;font:16px system-ui;line-height:1.6}main{max-width:500px;margin:5vh auto;padding:24px;border:1px solid #485746;border-radius:18px;background:#192021}button,a{display:inline-block;padding:12px 16px;border:0;border-radius:10px;margin:8px 0;background:#a5b49a;color:#101315;font:inherit;cursor:pointer}button:active{filter:brightness(1.3)}button:disabled{opacity:.6}[hidden]{display:none!important}#result{min-height:3em}</style><main><h1>Actualizar TEMPLE</h1><p>Instala la corrección de acceso y botones sin borrar tus perfiles, PIN, registros ni fotografías.</p><button id="update">Actualizar conservando mis datos</button><p id="result" role="status" aria-live="polite"></p><a id="open" href="./" hidden>Abrir TEMPLE actualizado</a><p>Necesitas conexión. Esta página no restablece ni cambia tu PIN.</p></main><script>
const button=document.getElementById('update'),result=document.getElementById('result'),openApp=document.getElementById('open');
button.addEventListener('click',async()=>{button.disabled=true;result.textContent='Descargando la actualización…';try{if(!('serviceWorker'in navigator)||!window.isSecureContext)throw Error('Abre esta página mediante la URL HTTPS de tu app.');const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();const worker=reg.installing||reg.waiting||reg.active;if(!worker)throw Error('No se encontró una actualización disponible.');if(worker.state!=='activated')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('La descarga sigue pendiente. Comprueba la conexión y vuelve a intentar.')),60000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'){clearTimeout(timeout);resolve()}else if(worker.state==='redundant'){clearTimeout(timeout);reject(Error('No se completó la descarga. Vuelve a intentar con conexión.'))}})});result.textContent='Actualización instalada. Puedes abrir TEMPLE con tus perfiles habituales.';openApp.hidden=false;openApp.style.display='inline-block'}catch(error){result.textContent=error.message}finally{button.disabled=false}});
</script></html>
